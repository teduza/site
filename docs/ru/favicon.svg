<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="coreGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B870"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#EAB308" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background container with squircle border -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="url(#ringGrad)" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Subtle ambient core glow -->
  <circle cx="50" cy="50" r="32" fill="url(#haloGrad)"/>

  <!-- Outer orbital precision ring -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="32 12" stroke-linecap="round"/>

  <!-- Inner orbital ring -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="14 14" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Autonomous Sovereign Core Node -->
  <circle cx="50" cy="50" r="8" fill="url(#coreGold)"/>
  <circle cx="50" cy="50" r="3.5" fill="#FFFFFF"/>

  <!-- Four cardinal precision tick marks -->
  <line x1="50" y1="12" x2="50" y2="17" stroke="url(#coreGold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="83" x2="50" y2="88" stroke="url(#coreGold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="17" y2="50" stroke="url(#coreGold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="83" y1="50" x2="88" y2="50" stroke="url(#coreGold)" stroke-width="2" stroke-linecap="round"/>
</svg>
