<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B870"/>
      <stop offset="50%" stop-color="#C59B4B"/>
      <stop offset="100%" stop-color="#F3E5AB"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle rounded corners -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Stylized Geometric S with Celestial Orbit Accent -->
  <path d="M 68 32 C 65 24 55 22 48 22 C 36 22 28 30 28 41 C 28 53 38 57 52 61 C 66 65 72 70 72 79 C 72 90 62 96 50 96 C 36 96 28 88 26 78" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="7" 
        stroke-linecap="round"/>
        
  <!-- M.A.R.S. Companion Orbital Node -->
  <circle cx="70" cy="28" r="4.5" fill="url(#goldGrad)"/>
</svg>
